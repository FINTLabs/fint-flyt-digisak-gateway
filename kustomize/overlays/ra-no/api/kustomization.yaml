apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ra-no

resources:
  - ../../../base

labels:
  - pairs:
      app.kubernetes.io/instance: fint-flyt-digisak-gateway_ra-no
      fintlabs.no/org-id: ra.no

patches:
  - patch: |-
      # ra-no gets the authorization client from 1Password, with other key names.
      - op: replace
        path: "/spec/env/2/valueFrom/secretKeyRef/key"
        value: "fint.flyt.authorization.sso.client-id"
      - op: replace
        path: "/spec/env/3/valueFrom/secretKeyRef/key"
        value: "fint.flyt.authorization.sso.client-secret"
      - op: replace
        path: "/spec/kafka/acls/0/topic"
        value: "ra-no.flyt.*"
      - op: replace
        path: "/spec/orgId"
        value: "ra.no"
      - op: add
        path: "/spec/env/-"
        value:
          name: novari.kafka.topic.org-id
          value: "ra-no"
      - op: add
        path: "/spec/env/-"
        value:
          name: server.servlet.context-path
          value: "/ra-no"
      - op: replace
        path: "/spec/ingress/basePath"
        value: "/ra-no/api/digisak"
      - op: replace
        path: "/spec/probes/readiness/path"
        value: "/ra-no/actuator/health"
    target:
      kind: Application
      name: fint-flyt-digisak-gateway
