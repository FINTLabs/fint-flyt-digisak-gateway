apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ra-no

resources:
  - ../../../base

labels:
  - pairs:
      app.kubernetes.io/instance: fint-flyt-digisak-gateway_ra-no
      fintlabs.no/org-id: ra.no

patches:
  - patch: |-
      - op: replace
        path: "/spec/kafka/acls/0/topic"
        value: "ra-no.flyt.*"
      - op: replace
        path: "/spec/orgId"
        value: "ra.no"
      - op: add
        path: "/spec/url/basePath"
        value: "/beta/ra-no"
      - op: replace
        path: "/spec/ingress/basePath"
        value: "/beta/ra-no/api/digisak"
      - op: replace
        path: "/spec/probes/readiness/path"
        value: "/beta/ra-no/actuator/health"
    target:
      kind: Application
      name: fint-flyt-digisak-gateway
